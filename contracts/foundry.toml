[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read", path = "./" }]

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"

# Robinhood Chain testnet. Replace `rpc_endpoints`/`etherscan` values with the
# real Robinhood Chain testnet details once published — see README.md for how
# to find current RPC/explorer/faucet info.
[rpc_endpoints]
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC_URL}"
robinhood_mainnet = "${ROBINHOOD_MAINNET_RPC_URL}"

[etherscan]
robinhood_testnet = { key = "${ROBINHOOD_EXPLORER_API_KEY}", url = "${ROBINHOOD_EXPLORER_API_URL}" }
